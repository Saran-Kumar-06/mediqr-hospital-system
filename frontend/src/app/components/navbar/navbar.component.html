<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-inner">
    <a routerLink="/dashboard" class="nav-brand" (click)="closeMenu()">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 5h2v4h4v2h-4v4h-2v-4H7v-2h4V7z" fill="currentColor"/>
        </svg>
      </div>
      <span class="brand-name">Medi<strong>QR</strong></span>
    </a>

    <div class="nav-links" [class.open]="mobileMenuOpen">
      <a routerLink="/dashboard" class="nav-link" [class.active]="isActive('/dashboard')" (click)="closeMenu()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Dashboard
      </a>
      <a *ngIf="authService.isNurse()" routerLink="/register" class="nav-link" [class.active]="isActive('/register')" (click)="closeMenu()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M12 3a4 4 0 100 8 4 4 0 000-8zM20 8v6M23 11h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Register Patient
      </a>
      <a routerLink="/scan" class="nav-link" [class.active]="isActive('/scan')" (click)="closeMenu()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="5" height="5" rx="1" stroke="currentColor" stroke-width="2"/><rect x="16" y="3" width="5" height="5" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="16" width="5" height="5" rx="1" stroke="currentColor" stroke-width="2"/><path d="M16 16h5v5M16 16v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3 12h7M14 12h7M12 3v7M12 14v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Scan QR
      </a>

      <div class="nav-divider"></div>
      
      <span *ngIf="authService.currentUserValue" class="nav-badge" style="background: var(--accent); color: white;">
        {{ authService.currentUserValue.role }}
      </span>

      <a *ngIf="authService.isAuthenticated()" href="javascript:void(0)" (click)="logout()" class="nav-link logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="mobileMenuOpen" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
